name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ExamBuilderGR.sln

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "ExamBuilderGR/ExamBuilderGR.csproj"
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Version not found in csproj." }
          $numbers = [regex]::Matches($version, '\d+') | ForEach-Object { [int]$_.Value }
          while ($numbers.Count -lt 4) { $numbers += 0 }
          $binaryVersion = ($numbers | Select-Object -First 4) -join '.'
          "app_version=$version" >> $env:GITHUB_OUTPUT
          "binary_version=$binaryVersion" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained portable folder
        shell: pwsh
        run: |
          dotnet publish ExamBuilderGR/ExamBuilderGR.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output artifacts/portable

          Copy-Item README.md artifacts/portable/README.md
          Copy-Item CHANGELOG.md artifacts/portable/CHANGELOG.md
          Copy-Item docs/START_HERE.txt artifacts/portable/START_HERE.txt

      - name: Publish self-contained single-file EXE
        shell: pwsh
        run: |
          dotnet publish ExamBuilderGR/ExamBuilderGR.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output artifacts/single-file

          Copy-Item README.md artifacts/single-file/README.md
          Copy-Item CHANGELOG.md artifacts/single-file/CHANGELOG.md
          Copy-Item docs/START_HERE.txt artifacts/single-file/START_HERE.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.app_version }}"
          $binaryVersion = "${{ steps.version.outputs.binary_version }}"
          $portable = (Resolve-Path "artifacts/portable").Path
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }

          & $iscc `
            "/DMyAppVersion=$version" `
            "/DMyBinaryVersion=$binaryVersion" `
            "/DSourceDir=$portable" `
            "installer/ExamBuilderGR.iss"

          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Create release packages and checksums
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.app_version }}"
          $portableZip = "ExamBuilderGR_v${version}_win-x64_portable.zip"
          $singleZip = "ExamBuilderGR_v${version}_win-x64_single-file.zip"
          $sourceZip = "ExamBuilderGR_v${version}_Source.zip"

          Compress-Archive -Path "artifacts/portable/*" -DestinationPath "artifacts/$portableZip" -Force
          Compress-Archive -Path "artifacts/single-file/*" -DestinationPath "artifacts/$singleZip" -Force
          git archive --format=zip --output "artifacts/$sourceZip" HEAD

          $installer = Get-ChildItem "dist/installer" -Filter "ExamBuilderGR_Setup_v*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer EXE was not created." }
          Copy-Item $installer.FullName "artifacts/$($installer.Name)" -Force

          $releaseFiles = @(
            "artifacts/$portableZip",
            "artifacts/$singleZip",
            "artifacts/$sourceZip",
            "artifacts/$($installer.Name)"
          )

          $hashes = foreach ($file in $releaseFiles) {
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash)  $([System.IO.Path]::GetFileName($file))"
          }
          $hashes | Set-Content "artifacts/SHA256SUMS.txt" -Encoding ASCII

          "portable_zip=$portableZip" >> $env:GITHUB_OUTPUT
          "single_zip=$singleZip" >> $env:GITHUB_OUTPUT
          "source_zip=$sourceZip" >> $env:GITHUB_OUTPUT
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ExamBuilderGR-windows-release
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          retention-days: 30

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "RELEASE_NOTES_v1.0.0.md"
          $args = @(
            "release", "create", $tag,
            "artifacts/${{ steps.package.outputs.portable_zip }}",
            "artifacts/${{ steps.package.outputs.single_zip }}",
            "artifacts/${{ steps.package.outputs.source_zip }}",
            "artifacts/${{ steps.package.outputs.installer_name }}",
            "artifacts/SHA256SUMS.txt",
            "--title", "ExamBuilder GR $tag",
            "--verify-tag"
          )

          if (Test-Path $notes) {
            $args += @("--notes-file", $notes)
          }
          else {
            $args += "--generate-notes"
          }

          if ($tag -match '(?i)(alpha|beta|rc|preview)') {
            $args += "--prerelease"
          }

          gh @args
